<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - BudgetBridge</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="logo-row">
        <div class="logo-mark">BB</div>
        <div class="logo-text"><strong>BudgetBridge</strong><span>Personal Expense Tracker</span></div>
      </div>
      <nav class="nav-list">
        <a class="nav-link " href="dashboard.html"><span class="nav-icon">⌂</span>Dashboard</a>
        <a class="nav-link " href="transactions.html"><span class="nav-icon">☷</span>Transactions</a>
        <a class="nav-link " href="categories.html"><span class="nav-icon">◴</span>Categories</a>
        <a class="nav-link " href="reports.html"><span class="nav-icon">▥</span>Reports</a>
        <a class="nav-link active" href="settings.html"><span class="nav-icon">⚙</span>Settings</a>
      </nav>
      <div class="logout-block">
        <button class="btn btn-secondary btn-full" onclick="logout()">Logout</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="page-title"><h1>Settings</h1><p>Update basic account information.</p></div></header>
      <section class="card form-card">
        <form id="settingsForm">
          <div class="form-group"><label for="settingsName">Full Name</label><input id="settingsName" type="text" required></div>
          <div class="form-group"><label for="settingsEmail">Email</label><input id="settingsEmail" type="email" required></div>
          <div class="form-actions"><button class="btn btn-primary" type="submit">Save Settings</button><a class="btn btn-secondary" href="dashboard.html">Cancel</a></div>
          <div id="settingsMessage" class="success-text"></div>
        </form>
      </section>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
