<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - BudgetBridge</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo-row">
                <div class="logo-mark">BB</div>
                <div class="logo-text">
                    <strong>BudgetBridge</strong>
                    <span>Personal Expense Tracker</span>
                </div>
            </div>

            <nav class="nav-list">
                <a class="nav-link" href="dashboard.html"><span class="nav-icon">⌂</span>Dashboard</a>
                <a class="nav-link" href="transactions.html"><span class="nav-icon">☷</span>Transactions</a>
                <a class="nav-link active" href="categories.html"><span class="nav-icon">◴</span>Categories</a>
                <a class="nav-link" href="reports.html"><span class="nav-icon">▥</span>Reports</a>
                <a class="nav-link" href="settings.html"><span class="nav-icon">⚙</span>Settings</a>
            </nav>

            <div class="logout-block">
                <button class="btn btn-secondary btn-full" onclick="logout()">Logout</button>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <div class="page-title">
                    <h1>Categories</h1>
                    <p>Create and manage categories used in transaction forms.</p>
                </div>
            </header>

            <section class="grid-2">
                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2>Add Category</h2>
                            <p>Custom categories help organize spending.</p>
                        </div>
                    </div>

                    <form id="categoryForm">
                        <div class="form-group">
                            <label for="newCategory">Category Name</label>
                            <input
                                id="newCategory"
                                type="text"
                                placeholder="Example: Subscriptions"
                            >
                        </div>

                        <div class="form-group">
                            <label for="categoryType">Category Type</label>
                            <select id="categoryType">
                                <option value="expense">Expense</option>
                                <option value="income">Income</option>
                            </select>
                        </div>

                        <button class="btn btn-primary" type="submit">Add Category</button>
                    </form>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2>Current Categories</h2>
                            <p>Default and custom categories.</p>
                        </div>
                    </div>

                    <div id="categoryList" class="category-list"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
