<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add Transaction - BudgetBridge</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="add-transaction" data-protected="true"><div class="app-shell">
<aside class="sidebar" id="sidebar">
  <div class="logo-row"><div class="logo-mark">BB</div><div class="logo-text"><strong>BudgetBridge</strong><span>Personal Expense Tracker</span></div></div>
  <nav class="nav-list" aria-label="Main navigation">
    <a class="nav-link " href="dashboard.html"><span class="nav-icon">D</span>Dashboard</a>
    <a class="nav-link active" href="transactions.html"><span class="nav-icon">T</span>Transactions</a>
    <a class="nav-link " href="categories.html"><span class="nav-icon">C</span>Categories</a>
    <a class="nav-link " href="reports.html"><span class="nav-icon">R</span>Reports</a>
    <a class="nav-link " href="settings.html"><span class="nav-icon">S</span>Settings</a>
  </nav>
  <div class="sidebar-user"><span>Signed in as</span><strong data-user-name>User</strong></div>
  <button class="btn btn-secondary btn-full" data-action="logout" type="button">Logout</button>
</aside>
<main class="main"><header class="topbar"><button class="mobile-menu" data-action="menu" type="button">Menu</button><div class="page-title"><h1>Add Transaction</h1><p>Create a new income or expense record.</p></div><a class="btn btn-secondary" href="transactions.html">Back</a></header><section class="card form-card">
<form id="transactionForm" class="stack-form" novalidate>
  <div class="form-group"><label>Transaction Type</label><div id="selectedType" class="type-preview">Choose a category to determine income or expense.</div></div>
  <div class="form-group"><label for="amount">Amount</label><input id="amount" type="number" min="0.01" max="99999999.99" step="0.01" required></div>
  <div class="form-group"><label for="category">Category</label><select id="category" required><option value="">Select a category</option></select></div>
  <div class="form-group"><label for="date">Date</label><input id="date" type="date" required></div>
  <div class="form-group"><label for="description">Description</label><textarea id="description" maxlength="255" placeholder="Optional description"></textarea></div>
  <div class="form-actions"><button class="btn btn-primary" type="submit">Save Transaction</button><a class="btn btn-secondary" href="transactions.html">Cancel</a></div>
  <div id="formMessage" class="message" role="status" aria-live="polite"></div>
</form>
</section></main></div><script src="js/app.js"></script></body></html>
