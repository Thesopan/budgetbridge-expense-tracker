<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Transaction - BudgetBridge</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="logo-row">
        <div class="logo-mark">BB</div>
        <div class="logo-text"><strong>BudgetBridge</strong><span>Personal Expense Tracker</span></div>
      </div>
      <nav class="nav-list">
        <a class="nav-link " href="dashboard.html"><span class="nav-icon">⌂</span>Dashboard</a>
        <a class="nav-link active" href="transactions.html"><span class="nav-icon">☷</span>Transactions</a>
        <a class="nav-link " href="categories.html"><span class="nav-icon">◴</span>Categories</a>
        <a class="nav-link " href="reports.html"><span class="nav-icon">▥</span>Reports</a>
        <a class="nav-link " href="settings.html"><span class="nav-icon">⚙</span>Settings</a>
      </nav>
      <div class="logout-block">
        <button class="btn btn-secondary btn-full" onclick="logout()">Logout</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="page-title"><h1>Add Transaction</h1><p>Create a new income or expense record.</p></div><a class="btn btn-secondary" href="dashboard.html">Back to Dashboard</a></header>
      <section class="card form-card">
        <form id="transactionForm">
          <div class="form-group"><label>Transaction Type</label><div class="segment"><label><input type="radio" name="type" value="income"><span>Income</span></label><label><input type="radio" name="type" value="expense" checked><span>Expense</span></label></div></div>
          <div class="form-group"><label for="amount">Amount</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="Enter amount" required></div>
          <div class="form-group"><label for="category">Category</label><select id="category" data-categories required></select></div>
          <div class="form-group"><label for="date">Date</label><input id="date" type="date" required></div>
          <div class="form-group"><label for="description">Description</label><textarea id="description" placeholder="Enter description"></textarea></div>
          <div class="form-actions"><button class="btn btn-primary" type="submit">Save Transaction</button><a class="btn btn-secondary" href="dashboard.html">Cancel</a></div>
          <div id="formMessage" class="error-text"></div>
        </form>
      </section>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
