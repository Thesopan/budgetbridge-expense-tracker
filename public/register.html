<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register - BudgetBridge</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page" data-page="register">
  <main class="auth-card">
    <div class="logo-row"><div class="logo-mark">BB</div><div class="logo-text"><strong>BudgetBridge</strong><span>Personal Expense Tracker</span></div></div>
    <h1>Create Account</h1><p>Register to start tracking income and expenses.</p>
    <form id="registerForm" novalidate>
      <div class="form-group"><label for="fullName">Full Name</label><input id="fullName" type="text" autocomplete="name" maxlength="100" required></div>
      <div class="form-group"><label for="email">Email</label><input id="email" type="email" autocomplete="email" maxlength="150" required></div>
      <div class="form-group"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" maxlength="128" required><small>At least 8 characters with uppercase, lowercase, and a number.</small></div>
      <div class="form-group"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" autocomplete="new-password" maxlength="128" required></div>
      <button class="btn btn-primary btn-full" type="submit">Create Account</button>
      <div id="authMessage" class="message" role="status" aria-live="polite"></div>
    </form>
    <div class="link-line">Already have an account? <a href="index.html">Login</a></div>
  </main><script src="js/app.js"></script>
</body></html>
