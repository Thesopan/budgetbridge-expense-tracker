<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - BudgetBridge</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <section class="auth-card">
    <div class="logo-row">
      <div class="logo-mark">BB</div>
      <div class="logo-text"><strong>BudgetBridge</strong><span>Personal Expense Tracker</span></div>
    </div>
    <h1>Create Account</h1>
    <p>Set up your account and start tracking income and expenses.</p>
    <form id="registerForm">
      <div class="form-group"><label for="fullName">Full Name</label><input id="fullName" type="text" placeholder="Enter your full name" required></div>
      <div class="form-group"><label for="email">Email</label><input id="email" type="email" placeholder="Enter your email" required></div>
      <div class="form-group"><label for="password">Password</label><input id="password" type="password" placeholder="Create a password" required></div>
      <div class="form-group"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" placeholder="Confirm your password" required></div>
      <button class="btn btn-primary btn-full" type="submit">Create Account</button>
      <div id="authMessage" class="error-text"></div>
    </form>
    <div class="link-line">Already have an account? <a href="index.html">Login</a></div>
  </section>
  <script src="js/app.js"></script>
</body>
</html>
