<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reports - BudgetBridge</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="reports" data-protected="true"><div class="app-shell">
<aside class="sidebar" id="sidebar">
  <div class="logo-row"><div class="logo-mark">BB</div><div class="logo-text"><strong>BudgetBridge</strong><span>Personal Expense Tracker</span></div></div>
  <nav class="nav-list" aria-label="Main navigation">
    <a class="nav-link " href="dashboard.html"><span class="nav-icon">D</span>Dashboard</a>
    <a class="nav-link " href="transactions.html"><span class="nav-icon">T</span>Transactions</a>
    <a class="nav-link " href="categories.html"><span class="nav-icon">C</span>Categories</a>
    <a class="nav-link active" href="reports.html"><span class="nav-icon">R</span>Reports</a>
    <a class="nav-link " href="settings.html"><span class="nav-icon">S</span>Settings</a>
  </nav>
  <div class="sidebar-user"><span>Signed in as</span><strong data-user-name>User</strong></div>
  <button class="btn btn-secondary btn-full" data-action="logout" type="button">Logout</button>
</aside>
<main class="main"><header class="topbar"><button class="mobile-menu" data-action="menu" type="button">Menu</button><div class="page-title"><h1>Reports</h1><p>Analyze income and spending for a selected date range.</p></div></header>
<section class="card"><form id="reportForm" class="report-filter"><div class="form-group"><label for="reportStart">Start Date</label><input id="reportStart" type="date"></div><div class="form-group"><label for="reportEnd">End Date</label><input id="reportEnd" type="date"></div><button class="btn btn-primary" type="submit">Generate Summary</button></form></section>
<section class="grid-3"><div class="card stat-card income"><small>Total Income</small><h2 id="reportIncome">$0.00</h2></div><div class="card stat-card expense"><small>Total Expenses</small><h2 id="reportExpenses">$0.00</h2></div><div class="card stat-card balance"><small>Balance</small><h2 id="reportBalance">$0.00</h2></div></section>
<section class="card"><div class="card-header"><div><h2>Spending by Category</h2><p>Expense totals grouped by category.</p></div></div><div id="categoryReport" class="report-list"></div><div id="reportMessage" class="message" role="status"></div></section>
</main></div><script src="js/app.js"></script></body></html>
